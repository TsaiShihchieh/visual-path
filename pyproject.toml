[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-path"
version = "0.1.0"
description = "A local-first tool for finding paths through image collections."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.44"]
torch = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.40"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
visual-path = "visual_path.app:main"

[tool.setuptools.packages.find]
include = ["visual_path*"]
